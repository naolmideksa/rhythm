name: Android CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create private.properties for build
      env:
        PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
      run: |
        if [ -n "$PRIVATE_PROPERTIES" ]; then
          printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./private.properties
        else
          touch ./private.properties
        fi

    - name: Build with Gradle (GitHub flavor only)
      env:
        APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
      run: ./gradlew assembleGithubRelease assembleGithubDebug

    - name: Generate build info
      if: github.event_name == 'pull_request'
      run: |
        echo "Build completed at: $(date)" > build_info.txt
        echo "Commit: ${{ github.sha }}" >> build_info.txt
        echo "Branch: ${{ github.head_ref }}" >> build_info.txt

    - name: Upload APK artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rhythm-octave-apk
        path: |
          app/build/outputs/apk/github/debug/*.apk
          app/build/outputs/apk/github/release/*.apk
        retention-days: 14